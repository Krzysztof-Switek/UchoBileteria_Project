{% comment %}
Inline line icons: {% include "admin/ucho_icon.html" with name="gate" %} (optional size=18).
Stroke = currentColor, so colour comes from the theme (.ucho-tile-icon sets the
accent). Inline SVG on purpose — no icon font / CDN on the admin pages.
{% endcomment %}
<svg class="ucho-icon" width="{{ size|default:28 }}" height="{{ size|default:28 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"

{% elif name == "download" %}
