<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bileteria UCHO{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    {% if payment_demo_mode %}
    <div class="bg-amber-500 text-black text-center text-sm font-bold py-1.5 px-4">
        TRYB DEMO — płatności realizowane są wirtualną walutą, żadne prawdziwe pieniądze nie są pobierane.
    </div>
    {% endif %}
    <main class="max-w-3xl mx-auto px-4 py-8">
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 {% if message.tags == 'error' %}bg-red-900/60 text-red-200{% elif message.tags == 'warning' %}bg-amber-900/60 text-amber-200{% else %}bg-emerald-900/60 text-emerald-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
