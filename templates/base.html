<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bileteria UCHO{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    {% if payment_demo_mode %}
    <div class="bg-amber-500 text-black text-center text-sm font-bold py-1.5 px-4">
        TRYB DEMO — płatności realizowane są wirtualną walutą, żadne prawdziwe pieniądze nie są pobierane.
    </div>
    {% endif %}
    <main class="max-w-3xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
