<!DOCTYPE html>
{% load static %}
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bileteria UCHO — panel{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dist/tailwind.css' %}">
</head>
<body class="min-h-screen">
    {% include "partials/staff_nav.html" %}
    <main class="max-w-6xl mx-auto px-4 py-8">
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 {% if message.tags == 'error' %}msg-danger{% elif message.tags == 'warning' %}msg-warning{% else %}msg-success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
