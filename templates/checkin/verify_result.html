{% extends "base.html" %}

{% block title %}Wynik weryfikacji{% endblock %}

{% block content %}
<div class="rounded-2xl p-10 text-center {% if ok %}bg-emerald-600{% else %}bg-red-700{% endif %}">
    <div class="text-3xl font-extrabold">{{ message }}</div>
    {% if ticket %}
    <div class="mt-3 text-lg">{{ ticket.short_code }} · {{ ticket.buyer_email }}</div>
    {% endif %}
</div>
<div class="mt-6 flex gap-3">
    <a href="{% url 'checkin:scanner' event.id %}"
       class="bg-zinc-800 hover:bg-zinc-700 rounded-lg px-4 py-2">Wróć do skanera</a>
    <a href="{% url 'checkin:search' event.id %}"
       class="bg-zinc-800 hover:bg-zinc-700 rounded-lg px-4 py-2">Szukaj biletu</a>
</div>
{% endblock %}
