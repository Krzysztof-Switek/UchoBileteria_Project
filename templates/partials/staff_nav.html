{% load static %}
<nav class="border-b-theme" style="background: var(--surface);">
    <div class="max-w-6xl mx-auto px-4 flex items-center gap-1 overflow-x-auto text-sm">
        <a href="{% url 'admin:index' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Start</a>
        <a href="{% url 'admin:events_event_changelist' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Wydarzenia</a>
        <a href="{% url 'admin:orders_order_changelist' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Zamówienia</a>
        <a href="{% url 'admin:tickets_ticket_changelist' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Bilety</a>
        <a href="{% url 'checkin:event_select' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Odprawa</a>
        <a href="{% url 'reports:dashboard' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Raporty</a>
        <a href="{% url 'admin:auditlog_auditlog_changelist' %}" class="link-quiet px-3 py-1.5 my-1.5 whitespace-nowrap rounded-full hover:bg-[var(--surface-2)] transition-colors">Dziennik</a>
        <form method="get" action="{% url 'reports:global_search' %}" class="ml-auto flex items-center py-2">
            <input type="search" name="q" id="global-search-input"
                   placeholder="Szukaj: kod, e-mail, ID, wydarzenie… (/)"
                   class="input-theme w-40 sm:w-64 px-3 py-1.5 rounded-lg text-xs">
        </form>
        <div class="flex items-center gap-3 py-2 pl-3 whitespace-nowrap">
            {% if payment_demo_mode %}
            <span class="text-xs font-bold px-2 py-1 rounded-full bg-amber-500 text-black">DEMO</span>
            {% else %}
            <span class="text-xs font-bold px-2 py-1 rounded-full btn-primary">LIVE</span>
            {% endif %}
            {% if user.is_authenticated %}
            <span class="text-muted text-xs">{{ user.email|default:user.get_username }}</span>
            {% endif %}
            <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Przełącz motyw">☀️</button>
        </div>
    </div>
</nav>
<script>
    document.addEventListener("keydown", (event) => {
        if (event.key !== "/") return;
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;
        event.preventDefault();
        document.getElementById("global-search-input").focus();
    });
</script>
