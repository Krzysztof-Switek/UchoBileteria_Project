{% extends "base.html" %}

{% block title %}Logowanie — Klub UCHO{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-zinc-900 rounded-xl p-6">
    <h1 class="text-xl font-bold">Logowanie obsługi</h1>
    {% if form.errors %}
    <p class="mt-3 text-red-400 text-sm">Nieprawidłowy login lub hasło.</p>
    {% endif %}
    <form method="post" class="mt-4 space-y-3">
        {% csrf_token %}
        <input type="text" name="username" placeholder="login" required autofocus
               class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2">
        <input type="password" name="password" placeholder="hasło" required
               class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2">
        <input type="hidden" name="next" value="{{ next }}">
        <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-lg px-4 py-2">
            Zaloguj
        </button>
    </form>
</div>
{% endblock %}
